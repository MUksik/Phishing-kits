disable_functions = exec,system,shell_exec,passthru,proc_open,popen,pcntl_exec,putenv,dl

allow_url_fopen = Off
allow_url_include = Off
expose_php = Off

display_errors = On
log_errors = On
error_log = /var/log/php-mail/php_errors.log

memory_limit = 128M
max_execution_time = 10
max_input_time = 10
post_max_size = 2M
upload_max_filesize = 2M
max_file_uploads = 2

open_basedir = /var/www/html:/tmp:/var/log/php-mail

sendmail_path = /usr/local/bin/fake-sendmail
mail.add_x_header = On
